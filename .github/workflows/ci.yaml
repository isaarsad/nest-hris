name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Database
      PGHOST: localhost
      PGUSER: developer
      PGPASSWORD: supersecretpassword
      PGDATABASE: hris_test
      PGPORT: 5432

      # JWT & Tokenize
      JWT_ACCESS_SECRET: supersecretaccesskey1234567890abcdef1234567890
      JWT_ACCESS_EXPIRES_IN: 15m
      REFRESH_TOKEN_TTL_IDLE_DAYS: 7
      REFRESH_TOKEN_TTL_ABSOLUTE_DAYS: 30
      REFRESH_TOKEN_CONCURRENCY_LEEWAY_MS: 5000

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: hris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developer -d hris_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: ['22.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations for test database
        run: npm run migration:run:test

      - name: Run all tests
        run: npm run test
